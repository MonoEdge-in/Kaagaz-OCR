# ElasticMQ, the laptop stand-in for Amazon SQS (docker-compose.yml mounts this
# file at /opt/elasticmq.conf). LAPTOP ONLY: in AWS the queues are made by the
# infrastructure code with the same names and the same redrive rule.
#
# PROVISIONAL: the maximum receives (5) is Vrushit's queue setting (PRD
# section 6). The lease is not set here: every receive asks for
# QUEUE_LEASE_SECONDS itself (kaagaz/adapters/queue.py).

include classpath("application.conf")

# Queue URLs in replies use the host the request came to ("*"), so the same
# queue is reachable as localhost:9324 from the laptop and elasticmq:9324 from
# the other containers.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

# Messages are kept on disk, so a job queued before a restart is still there
# after it (EC2 PRD WP-C). docker-compose.yml mounts the volume elasticmq-data
# at /data. The queues below are made from this file on every start.
messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/elasticmq.db"
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  # The jobs. The worker tries a job JOB_MAX_ATTEMPTS (5) times, and the next
  # delivery marks its document failed and buries it. 10 leaves spare
  # deliveries for that marking if the database is down; after 10 receives
  # without an ack, ElasticMQ moves a job to the failure bin by itself. The
  # worker refuses to start unless this is above JOB_MAX_ATTEMPTS + 1.
  kaagaz-jobs {
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "kaagaz-jobs-failed"
      maxReceiveCount = 10
    }
  }

  # The failure bin (dead-letter queue). The worker also puts jobs here that
  # failed for good, with a failure_code message attribute.
  kaagaz-jobs-failed { }
}
