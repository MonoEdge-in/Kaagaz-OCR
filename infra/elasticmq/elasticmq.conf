# ElasticMQ, the laptop stand-in for Amazon SQS (docker-compose.yml mounts this
# file at /opt/elasticmq.conf). LAPTOP ONLY: in AWS the queues are made by the
# infrastructure code with the same names and the same redrive rule.
#
# PROVISIONAL: the maximum receives (5) is Vrushit's queue setting (PRD
# section 6). The lease is not set here: every receive asks for
# QUEUE_LEASE_SECONDS itself (kaagaz/adapters/queue.py).

include classpath("application.conf")

# Queue URLs in replies use the host the request came to ("*"), so the same
# queue is reachable as localhost:9324 from the laptop and elasticmq:9324 from
# the other containers.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  # The jobs. After 5 receives without an ack (crashes and retryable failures
  # included), ElasticMQ moves a job to the failure bin by itself.
  kaagaz-jobs {
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "kaagaz-jobs-failed"
      maxReceiveCount = 5
    }
  }

  # The failure bin (dead-letter queue). The worker also puts jobs here that
  # failed for good, with a failure_code message attribute.
  kaagaz-jobs-failed { }
}
