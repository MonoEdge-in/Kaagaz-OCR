# Keycloak on the test server (#735), used INSTEAD of docker-compose.keycloak.yml (laptop):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.keycloak-server.yml --profile keycloak up -d --no-deps keycloak
# It is opt-in. The routine two-file deploy never starts or changes it.
# Production mode, its own Postgres database "keycloak". Caddy ends TLS and serves it at
# https://<KAAGAZ_DOMAIN>/kc/ (infra/caddy/Caddyfile). Nothing is published on the host.
# The admin console is not served from the internet; use kcadm.sh inside the container.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: ["keycloak"]
    command: ["start", "--import-realm"]
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HTTP_RELATIVE_PATH: /kc
      KC_HOSTNAME: https://${KAAGAZ_DOMAIN:?set KAAGAZ_DOMAIN in .env}/kc
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      # Heap at most half of the 1 GB limit, so the JVM's other memory fits.
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=25"
    # KC_BOOTSTRAP_ADMIN_USERNAME, KC_BOOTSTRAP_ADMIN_PASSWORD and KC_DB_PASSWORD.
    # Server-only, git-ignored, mode 600.
    env_file:
      - path: .env.keycloak-admin
        required: true
    volumes:
      # Imported only when the realm is not there yet.
      - ./keycloak/kaagaz-local-realm.json:/opt/keycloak/data/import/kaagaz-local-realm.json:ro
    # edge: Caddy and the API. data: Postgres.
    networks: [edge, data]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    memswap_limit: 1g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
