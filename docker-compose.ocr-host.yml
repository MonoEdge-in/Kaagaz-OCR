# Opt-in: the ocr service on this laptop's 127.0.0.1:8080, for a worker run
# outside Docker (OCR_URL=http://localhost:8080 in .env):
#   docker compose -f docker-compose.yml -f docker-compose.ocr-host.yml --profile paddle up ocr-relay
# An internal network cannot publish a port, and ocr on a network that can would
# have a way out to the internet. So ocr stays on ocr_net only, and ocr-relay
# (kaagaz/ocr_server/relay.py: bytes to ocr:8080 and back, nothing else) sits on
# ocr_net and on its own ocr_host network, to publish the port on 127.0.0.1.
# No other service is on ocr_host. Use it only when you need it, and not in AWS.
# VERIFY (no Docker on the build laptop): the relay starts and a worker outside
# Docker reads a page through it.
services:
  ocr-relay:
    image: kaagaz-ocr:local
    profiles: ["paddle"]
    command: ["python", "-m", "kaagaz.ocr_server.relay"]
    networks: [ocr_net, ocr_host]
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m # PROVISIONAL
    pids_limit: 64
    restart: unless-stopped
    depends_on:
      ocr:
        condition: service_started

networks:
  ocr_host: {}
