# Opt-in: the ocr service on this laptop's 127.0.0.1:8080, for a worker run
# outside Docker (OCR_URL=http://localhost:8080 in .env):
#   docker compose -f docker-compose.yml -f docker-compose.ocr-host.yml --profile paddle up ocr
# RISK: an internal network cannot publish a port, so this adds ocr to its own
# ocr_host network, which is not internal: with it, ocr has a way out to the
# internet. No other service is on ocr_host, so ocr still cannot reach the
# database, storage or queue. Use it only when you need it, and not in AWS.
# VERIFY (no Docker on the build laptop): compose merges the two network lists.
services:
  ocr:
    networks: [ocr_net, ocr_host]
    ports:
      - "127.0.0.1:8080:8080"

networks:
  ocr_host: {}
