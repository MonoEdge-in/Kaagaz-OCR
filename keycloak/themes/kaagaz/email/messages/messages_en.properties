# Plain wording for the two emails a new colleague gets (#735, #737). Placeholders are
# Keycloak's: {0} link, {2} realm name, {3} (reset) or {4} (set up) how long the link works.
executeActionsSubject=Set up your Kaagaz sign-in
executeActionsBody=Hello,\n\nYour administrator has invited you to Kaagaz. Open the link below to choose a password and connect an authenticator app on your phone.\n\n{0}\n\nThe link works for {4}.\n\nIf you did not expect this email, you can ignore it. Nothing will change.
executeActionsBodyHtml=<p>Hello,</p><p>Your administrator has invited you to Kaagaz. Open the link below to choose a password and connect an authenticator app on your phone.</p><p><a href="{0}">Set up your Kaagaz sign-in</a></p><p>The link works for {4}.</p><p>If you did not expect this email, you can ignore it. Nothing will change.</p>
passwordResetSubject=Reset your Kaagaz password
passwordResetBody=Hello,\n\nSomeone asked to reset the password for your Kaagaz sign-in. If this was you, open the link below to choose a new password.\n\n{0}\n\nThe link works for {3}.\n\nIf you did not ask for this, you can ignore this email. Your password stays the same.
passwordResetBodyHtml=<p>Hello,</p><p>Someone asked to reset the password for your Kaagaz sign-in. If this was you, open the link below to choose a new password.</p><p><a href="{0}">Choose a new password</a></p><p>The link works for {3}.</p><p>If you did not ask for this, you can ignore this email. Your password stays the same.</p>
