# Kaagaz-OCR local stack: `docker compose up --build` starts everything.
# Infrastructure only (to run the app on the host): `docker compose up postgres seaweedfs temporal`
# Image versions are pinned, and CI fails on :latest. Dependabot proposes updates.
name: kaagaz-ocr

# Shared by the app containers (migrate, api, worker).
x-app: &app
  env_file:
    - path: .env
      required: false
  environment:
    # Containers reach each other by service name; .env keeps localhost for running on the host.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kaagaz}:${POSTGRES_PASSWORD:-kaagaz}@postgres:5432/${POSTGRES_DB:-kaagaz}
    S3_ENDPOINT_URL: http://seaweedfs:8333
    TEMPORAL_ADDRESS: temporal:7233

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaagaz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaagaz}
      POSTGRES_DB: ${POSTGRES_DB:-kaagaz}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    # One process runs the master, volume server, filer and S3 gateway.
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30

  temporal:
    image: temporalio/temporal:1.9.1
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db
    user: root # lets the dev server write its state file to the named volume
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      temporal:
        condition: service_healthy

  worker:
    <<: *app
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:
  temporal-data:
