# Kaagaz local stack. LAPTOP ONLY: every key and password here is a local
# placeholder. docs/running-locally.md has the steps.
#
#   cp .env.example .env        (then set SESSION_SECRET and TOTP_ENCRYPTION_KEY)
#   docker compose up --build
#
# Only the stand-ins, to run the API and worker on the laptop itself:
#   docker compose up postgres seaweedfs elasticmq clamav
#
# Image versions are pinned; Dependabot proposes updates.
name: kaagaz-ocr

# Shared by the three backend containers (migrate, api, worker): one image,
# built from backend/Dockerfile, with a different command each. On the server,
# infra/ec2/deploy.sh sets KAAGAZ_TAG to a commit to build and migrate a new
# release beside the running one; :local is always what runs.
x-backend: &backend
  image: kaagaz-backend:${KAAGAZ_TAG:-local}
  build:
    context: ./backend
    args:
      # The commit the image is built from, shown by /api/health (#246 O1).
      KAAGAZ_COMMIT: ${KAAGAZ_TAG:-local}
  env_file: .env
  environment:
    # .env keeps localhost for running on the laptop; inside Docker the
    # services reach each other by service name.
    DATABASE_URL: postgresql://${POSTGRES_USER:-kaagaz}:${POSTGRES_PASSWORD:-kaagaz}@postgres:5432/${POSTGRES_DB:-kaagaz}
    STORAGE_ENDPOINT_URL: http://seaweedfs:8333
    QUEUE_ENDPOINT_URL: http://elasticmq:9324
    QUEUE_URL: http://elasticmq:9324/000000000000/kaagaz-jobs
    QUEUE_EXPRESS_URL: http://elasticmq:9324/000000000000/kaagaz-jobs-express
    # One worker runs here (PRD 5 Q3), so the reader's MODEL_RPM share and the upgrade
    # sweep's pace count one copy; docker-compose.prod.yml sets the server's number.
    WORKER_REPLICAS: "1"
    CLAMAV_HOST: clamav
    CLAMAV_PORT: "3310"

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaagaz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaagaz}
      POSTGRES_DB: ${POSTGRES_DB:-kaagaz}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # File storage with the S3 API (Amazon S3 in AWS). One process runs the
  # master, volume server, filer and S3 gateway. The access key is in
  # infra/seaweedfs/s3.json and must match STORAGE_ACCESS_KEY in .env.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # The S3 port itself (#439, 3 Nov 2026): the master on 9333 answers seconds before
      # it, and migrate's ensure_bucket then failed.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The job queue with the SQS API (Amazon SQS in AWS): kaagaz-jobs and its
  # failure bin kaagaz-jobs-failed, set up by infra/elasticmq/elasticmq.conf.
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"
    volumes:
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
      - elasticmq-data:/data # the stored messages (messages-storage in elasticmq.conf)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9324/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The virus scanner: clamd on TCP 3310. The image ships with signatures and
  # updates them on start; the first start can take several minutes, which is
  # what the long start period allows for.
  clamav:
    image: clamav/clamav:1.5.4
    # Strict scanning. The image writes each CLAMD_CONF_<Option> into clamd.conf
    # at start-up. Deny by default: a file clamd cannot fully look inside (too
    # big, too deep, encrypted) is reported, never passed as OK, and the scan
    # gate treats those reports as unscannable (backend/kaagaz/adapters/scanner.py).
    # PROVISIONAL: the scanner's configuration is Vrushit's decision.
    environment:
      CLAMD_CONF_StreamMaxLength: "60M" # above the 50 MB upload limit
      CLAMD_CONF_MaxFileSize: "100M"
      CLAMD_CONF_MaxScanSize: "400M"
      CLAMD_CONF_MaxRecursion: "10"
      CLAMD_CONF_MaxFiles: "10000"
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncrypted: "yes"
      CLAMD_CONF_AlertEncryptedArchive: "yes"
      CLAMD_CONF_AlertEncryptedDoc: "yes"
      CLAMD_CONF_AlertOLE2Macros: "yes"
      CLAMD_CONF_AlertBrokenExecutables: "yes"
      CLAMD_CONF_AlertBrokenMedia: "yes"
      CLAMD_CONF_AlertPhishingCloak: "yes"
      CLAMD_CONF_AlertPartitionIntersection: "yes"
      CLAMD_CONF_HeuristicAlerts: "yes"
      CLAMD_CONF_HeuristicScanPrecedence: "yes"
      CLAMD_CONF_DetectPUA: "yes"
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 6m

  # One-shot: database migrations, then the storage bucket, then it exits.
  migrate:
    <<: *backend
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        python -c "from kaagaz.adapters.storage import S3Storage;
        from kaagaz.settings import Settings;
        S3Storage(Settings.from_env()).ensure_bucket()"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "kaagaz.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      # The image has no curl. urlopen raises on a 503, so a degraded
      # /api/health fails the check.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      elasticmq:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["python", "-m", "kaagaz.worker_main"]
    # A bug ends the worker on purpose (kaagaz/worker_main.py); this brings it
    # back, and the job returns to the queue.
    restart: unless-stopped
    # SIGTERM lets the job in hand finish first. After this, Docker kills it
    # and the job is handed out again when its lease runs out (up to 20 minutes
    # of "Reading"). 10 minutes covers a slow page at high thinking and its low
    # read again (2 x OCR_TIMEOUT_SECONDS, up to 240 s each) plus the rest of the
    # document, so a deploy waits for the document instead of cutting it
    # (16 Oct 2026). An idle worker still stops at once.
    stop_grace_period: 600s
    # The worker's heartbeat (#246 A3): it touches a file each turn of its loop and while a
    # job runs; none for a whole job lease (QUEUE_LEASE_SECONDS) means it is stuck
    # (kaagaz/worker_heartbeat.py). Docker only reports it; nothing restarts on it.
    healthcheck:
      test: ["CMD", "python", "-m", "kaagaz.worker_heartbeat"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      elasticmq:
        condition: service_healthy
      clamav:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Next.js writes the /api rewrite into the build (frontend/Dockerfile).
        BACKEND_URL: http://api:8000
        # Google Analytics on the public pages (#457 phase 4), from .env; empty, none.
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    image: kaagaz-frontend:${KAAGAZ_TAG:-local}
    ports:
      - "3000:3000"
    healthcheck:
      # The slim image has no curl or wget (#477, 3 Nov 2026). fetch follows redirects;
      # any answer but 2xx, or none in 5 s, fails the check. infra/ec2/deploy.sh waits for it.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login', {signal: AbortSignal.timeout(5000)}).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:
  elasticmq-data:
  clamav-data:
