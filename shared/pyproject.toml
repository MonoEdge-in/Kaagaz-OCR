[project]
name = "kaagaz-shared"
version = "0.1.0"
description = "Code the API and the worker share: settings, database models and the storage helper."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "boto3>=1.43.102",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
