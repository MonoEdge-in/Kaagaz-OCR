# Opt-in: PaddleOCR-VL and Ollama on one NVIDIA GPU (an EC2 g4dn: a T4 with 16 GB),
# laid over docker-compose.yml. Laptops never use this file; without it nothing changes.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile paddle --profile ollama up -d --build
#
# The host needs: the NVIDIA driver 570 or newer (Ollama 0.35.0 bundles CUDA 12.8), the
# NVIDIA Container Toolkit 1.17.8 or newer, and Docker Compose 2.24.4 or newer (for
# `!reset` below). docs/running-locally.md, "On a GPU server (EC2 g4dn)", has the steps.
#
# Only what the GPU needs is set here; everything else, the ocr service's security
# settings included (no .env, ocr_net only, no port, read-only, no capabilities,
# no-new-privileges, user 10001), comes from docker-compose.yml unchanged.
# PROVISIONAL: paddlepaddle-gpu and the nvidia-*-cu12 wheels wait for Vrushit's approval.
# NOT RUN: nothing here has run on a GPU yet (no GPU on the build laptop).

services:
  ocr:
    image: kaagaz-ocr-gpu:local # its own tag, so it never overwrites the CPU image
    build:
      args:
        PADDLE_EXTRA: paddle-gpu # Dockerfile.ocr: paddlepaddle-gpu in place of paddlepaddle
    environment:
      OCR_DEVICE: "gpu:0"
      # Paddle takes GPU memory as it needs it, not most of the card at start, so
      # Ollama's two models fit beside it in the 16 GB.
      FLAGS_allocator_strategy: auto_growth
      # T4 (no bf16, no fast attention): a smaller image per text block so one big handwritten
      # or book block fits beside Ollama. 501760 = 28*28*640, a quarter of the attention memory
      # of the model's 1003520. PROVISIONAL: measure on g4dn.
      OCR_VL_MAX_PIXELS: "501760"
    # The weights sit on the GPU, so the container needs less host memory than on a
    # CPU (12g there). PROVISIONAL: measure on g4dn.
    mem_limit: 8g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ollama:
    # No port on the host: only the api and worker reach it, on Docker's network.
    # docker-compose.yml publishes 11434 for the laptop; a server must not.
    ports: !reset []
    environment:
      # One request at a time, so the GPU's memory holds one context. A chat question
      # waits while a document's facts are being read (a known limit, docs/architecture.md).
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2" # MODEL_CHAT and MODEL_EMBED, both kept loaded
      OLLAMA_KEEP_ALIVE: "-1" # never unloaded, so Paddle cannot take their memory
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # The api and worker reach Ollama by its service name. These win over the shared
  # x-backend block's MODEL_BASE_URL in docker-compose.yml (environment merges by name).
  api:
    environment:
      MODEL_BASE_URL: http://ollama:11434

  worker:
    environment:
      OCR_ENGINE: paddleocr_vl # scans go to the ocr service; RapidOCR stays the fallback
      OCR_DPI: "400" # scans drawn at 400 DPI for the GPU reader (small Devanagari, handwriting); laptops keep .env's value
      MODEL_BASE_URL: http://ollama:11434
