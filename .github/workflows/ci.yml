name: CI

# Runs on pull requests into main, on every push to main, every Monday (to catch new
# advisories for dependencies that haven't changed) and by hand. Guardrails, Python and
# Stack are required checks in the main ruleset, together with Pull request (pr.yml).
#
# Actions are pinned to full commit SHAs and tools to exact versions. Dependabot proposes
# updates to the actions; the tool versions are bumped by hand.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1" # Mondays, 09:00 in India
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a pull request replaces its running checks; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.19"

jobs:
  # ---------------------------------------------------------------------------
  # The repository itself: secrets, files that don't belong, workflows and docs.
  # ---------------------------------------------------------------------------
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads every commit, not only the latest
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: No secret files
        run: |
          set -euo pipefail
          # Templates hold setting names, not values, so .env.example passes.
          bad=$(git ls-files \
            | grep -Ei '(^|/)\.env($|\.)|(^|/)\.envrc$|\.(pem|key|p12|pfx|jks|keystore)$|(^|/)id_(rsa|dsa|ecdsa|ed25519)$|\.tfstate($|\.)|(^|/)\.terraform/' \
            | grep -Eiv '(^|/)\.env\.(example|sample|template)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Files that must never be committed are in this branch:"
            echo "$bad"
            echo "Remove them, rotate anything they contained, and tell Vrushit."
            exit 1
          fi
          echo "No secret files."

      - name: No secrets in any commit
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          # Every commit, so a secret that was added and later deleted is still caught.
          # --redact keeps whatever it finds out of the log.
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

      - name: No database password for anything but a local database
        run: |
          set -euo pipefail
          # Allowed only for localhost and the postgres service in docker-compose.yml.
          found=$(git grep -nIE 'postgres(ql)?(\+[a-z0-9]+)?://[^:/@[:space:]]+:[^@[:space:]]+@' \
            | grep -Ev '@(localhost|127\.0\.0\.1|postgres)([:/]|$)' || true)
          if [ -n "$found" ]; then
            echo "::error::A database URL with a password for a non-local host:"
            echo "$found"
            exit 1
          fi
          echo "No database passwords for real hosts."

      - name: No large files or real documents
        run: |
          set -euo pipefail
          big=$(git ls-files -z | xargs -0 -r du -k 2>/dev/null | awk '$1 > 2048 { print $1 " KB  " $2 }' || true)
          if [ -n "$big" ]; then
            echo "::error::Files over 2 MB are in this branch. Documents and test sets belong in storage, never in git."
            echo "$big"
            exit 1
          fi
          # A warning, not a failure: small synthetic samples and UI images are allowed.
          docs=$(git ls-files | grep -Ei '\.(pdf|xlsx|xls|tif|tiff|jpg|jpeg|png|heic)$' || true)
          if [ -n "$docs" ]; then
            echo "::warning::Document or image files are committed. Confirm each is a synthetic sample or a UI asset, never a real document:"
            echo "$docs"
          fi
          echo "Size check done."

      - name: No merge conflict markers
        run: |
          set -euo pipefail
          if git grep -nE '^(<<<<<<< |>>>>>>> |=======$)' -- . ':!*.md'; then
            echo "::error::Merge conflict markers are still in the code."
            exit 1
          fi
          echo "No conflict markers."

      - name: Workflows are valid and safe
        env:
          # zizmor's online checks: impostor commits and actions with known vulnerabilities.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uvx --from actionlint-py==1.7.12.25 actionlint
          uvx zizmor@1.30.1 --format=github .github/workflows

      - name: Spelling
        run: uvx typos@1.50.2

      - name: Links between docs resolve
        run: |
          set -euo pipefail
          # Every relative link in a Markdown file must point at something that exists.
          broken=0
          while IFS= read -r file; do
            while IFS= read -r target; do
              path="${target%%#*}"
              if [ -n "$path" ] && [ ! -e "$(dirname "$file")/$path" ]; then
                echo "::error file=$file::Broken link: $target"
                broken=1
              fi
            done < <(grep -oE '\]\([^)[:space:]]+\)' "$file" | sed -E 's/^\]\(//; s/\)$//' | grep -Ev '^(https?:|mailto:|#)' || true)
          done < <(git ls-files '*.md')
          if [ "$broken" -eq 0 ]; then echo "Every relative link resolves."; fi
          exit "$broken"

  # ---------------------------------------------------------------------------
  # The Python workspace, against a real PostgreSQL 17 with pgvector.
  # ---------------------------------------------------------------------------
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: kaagaz
          POSTGRES_PASSWORD: kaagaz_ci_only
          POSTGRES_DB: kaagaz_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaagaz -d kaagaz_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://kaagaz:kaagaz_ci_only@localhost:5432/kaagaz_ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install the workspace
        # --locked fails if uv.lock no longer matches the pyproject files.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Dependency licences
        run: uv run python .github/scripts/check_licences.py

      - name: Known vulnerabilities
        run: |
          set -euo pipefail
          # Every locked package, checked against the PyPI and OSV advisory databases.
          uv export --frozen --no-emit-workspace --format requirements.txt --quiet \
            --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip --progress-spinner off \
            --requirement "$RUNNER_TEMP/requirements.txt"

      - name: Migrations up, checked against the models, down and up again
        run: |
          set -euo pipefail
          if [ ! -f alembic.ini ]; then echo "::notice::No migrations yet. Day 1 adds them."; exit 0; fi
          uv run alembic upgrade head
          uv run alembic check # fails if the models describe a schema no migration creates
          uv run alembic downgrade base
          uv run alembic upgrade head
          echo "Migrations apply, match the models and reverse cleanly on an empty database."

      - name: Tests
        run: uv run pytest --durations=10

  # ---------------------------------------------------------------------------
  # Docker: the Compose file, the images, and the whole stack starting healthy.
  # Steps that need Day 1's Dockerfiles say so and skip until they exist.
  # ---------------------------------------------------------------------------
  stack:
    name: Stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compose file is valid
        run: docker compose config --quiet

      - name: Images are pinned to a version
        run: |
          set -euo pipefail
          shopt -s nullglob
          # A :latest or untagged image changes underneath us without a commit. Pin a
          # version; Dependabot proposes updates.
          bad=$(grep -HnE '^\s*image:\s*([^:[:space:]]+|\S+:latest)(\s|$)|^\s*FROM\s+(--platform=\S+\s+)?\S+:latest(\s|$)' \
            docker-compose.yml docker/*.Dockerfile || true)
          if [ -n "$bad" ]; then
            echo "::error::Unpinned images:"
            echo "$bad"
            exit 1
          fi
          echo "Every image is pinned."

      - name: Dockerfiles pass the build checks, and the images build
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(docker/*.Dockerfile)
          if [ ${#files[@]} -eq 0 ]; then echo "::notice::No Dockerfiles yet. Day 1 adds them."; exit 0; fi
          for file in "${files[@]}"; do
            docker build --check --file "$file" .
            docker build --file "$file" --tag "kaagaz-$(basename "$file" .Dockerfile):ci" .
          done

      - name: The whole stack starts healthy
        run: |
          set -euo pipefail
          for needed in docker/api.Dockerfile docker/worker.Dockerfile infra/seaweedfs/s3.json; do
            if [ ! -f "$needed" ]; then echo "::notice::Skipped until Day 1 adds $needed."; exit 0; fi
          done
          cp .env.example .env
          docker compose up --build --detach
          healthy=0
          for _ in $(seq 60); do
            if curl -fsS http://localhost:8000/health; then healthy=1; break; fi
            sleep 5
          done
          echo
          docker compose ps --all
          failed=$(docker compose ps --all --format '{{.Service}} {{.ExitCode}}' | awk '$2 != 0' || true)
          if [ "$healthy" -ne 1 ] || [ -n "$failed" ]; then
            docker compose logs --no-color --tail=100
            echo "::error::The stack didn't come up healthy. The logs above say why."
            exit 1
          fi
          echo "Every service started, and the API reports healthy."
