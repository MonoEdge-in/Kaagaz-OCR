name: CI

# Runs on pull requests into main, and by hand. The pull request's own rules
# (title, branch name, size, identity-number shapes) are in pr.yml.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Always runs. Fast, no toolchain needed. Catches the things that hurt most.
  # ---------------------------------------------------------------------------
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: No secret files committed
        run: |
          set -euo pipefail
          BAD=$(git ls-files | grep -Ei '(^|/)\.env($|\.)|\.pem$|\.p12$|\.pfx$|(^|/)id_rsa$|\.keystore$' | grep -Eiv '(^|/)\.env\.(example|sample|template)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Files that must never be committed are in this branch."
            echo "$BAD"
            echo "Remove them, rotate anything inside them, and tell Vrushit."
            exit 1
          fi
          echo "Clean. No env or key files committed."

      - name: No secret values in the diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ]; then echo "Not a pull request, skipping."; exit 0; fi
          ADDED=$(git diff --unified=0 "$BASE" "$HEAD" | grep '^+' | grep -v '^+++' || true)
          FOUND=0
          check() {
            if printf '%s' "$ADDED" | grep -Eq "$1"; then
              echo "::error::Possible $2 added in this pull request."
              FOUND=1
            fi
          }
          check 'AKIA[0-9A-Z]{16}'                     "AWS access key id"
          check 'aws_secret_access_key[[:space:]]*='   "AWS secret key"
          check 'BEGIN [A-Z ]*PRIVATE KEY'             "private key"
          check 'gh[pousr]_[A-Za-z0-9]{36}'            "GitHub token"
          check 'sk-[A-Za-z0-9]{20,}'                  "API key"
          REMOTE_DB=$(printf '%s' "$ADDED" | grep -Eo 'postgres(ql)?(\+[a-z0-9]+)?://[^:/@[:space:]]+:[^@[:space:]]+@[^:/[:space:]]+' \
            | grep -Ev '@(localhost|127\.0\.0\.1|postgres)$' || true)
          if [ -n "$REMOTE_DB" ]; then
            echo "::error::Possible database password for a non-local host added in this pull request."
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            echo "If this is a false positive, say so in the pull request and Vrushit will decide."
            exit 1
          fi
          echo "Clean. No secret shaped strings added."


      - name: No merge conflict markers
        run: |
          set -euo pipefail
          if git grep -nE '^(<<<<<<< |>>>>>>> |=======$)' -- . ':!*.md' >/dev/null 2>&1; then
            echo "::error::Merge conflict markers are still in the code."
            git grep -nE '^(<<<<<<< |>>>>>>> |=======$)' -- . ':!*.md' || true
            exit 1
          fi
          echo "Clean. No conflict markers."

      - name: No large or customer files committed
        run: |
          set -euo pipefail
          BIG=$(git ls-files -z | xargs -0 -r du -k 2>/dev/null | awk '$1 > 2048 { print $1 "KB  " $2 }' || true)
          if [ -n "$BIG" ]; then
            echo "::error::Files over 2MB are in this branch. Customer documents and test corpora belong in storage, never in git."
            echo "$BIG"
            exit 1
          fi
          echo "Clean. Nothing oversized."

      - name: Production compose renders
        run: |
          set -euo pipefail
          # The three compose files the EC2 server runs (Deployment PRD, WP-B), merged by
          # Docker Compose itself. Made-up values in a temporary .env: nothing real is read.
          dir="$RUNNER_TEMP/compose-prod"
          mkdir -p "$dir"
          printf '%s\n' KAAGAZ_DOMAIN=kaagaz.example.test ACME_EMAIL=admin@example.test \
            SEAWEEDFS_S3_CONFIG=/home/ubuntu/kaagaz-secrets/s3.json > "$dir/.env"
          docker compose version
          docker compose --project-directory "$dir" -f docker-compose.yml -f docker-compose.gpu.yml \
            -f docker-compose.prod.yml --profile ollama --profile paddle config --format json > "$dir/merged.json"
          ports=$(jq -c '[.services | to_entries[] | select(.value.ports) | {(.key): [.value.ports[].published]}]' "$dir/merged.json")
          keys=$(jq -c '[.services.seaweedfs.volumes[] | select(.target == "/etc/seaweedfs/s3.json") | .source]' "$dir/merged.json")
          echo "Published ports: $ports"
          echo "SeaweedFS keys file: $keys"
          if [ "$ports" != '[{"caddy":["80","443"]}]' ] || [ "$keys" != '["/home/ubuntu/kaagaz-secrets/s3.json"]' ]; then
            echo "::error::Only caddy may publish ports (80 and 443), and SeaweedFS must read only the server's keys file."
            exit 1
          fi
          echo "The production compose files render."



  # ---------------------------------------------------------------------------
  # Backend. Runs against a real Postgres with pgvector, because the isolation
  # tests are meaningless against a fake database.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: kaagaz
          POSTGRES_PASSWORD: kaagaz_ci_only
          POSTGRES_DB: kaagaz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaagaz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kaagaz:kaagaz_ci_only@localhost:5432/kaagaz_test
      PYTHONDONTWRITEBYTECODE: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # constraints.txt pins what indic-transliteration brings in, as the image does.
          pip install -c constraints.txt -e ".[dev,ocr]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy .

      - name: Dependency licences
        run: |
          set -euo pipefail
          pip install pip-licenses
          pip-licenses --format=csv --with-urls > licences.csv
          echo "Installed packages and their licences:"
          cat licences.csv
          if grep -Eiq 'affero|AGPL|SSPL|"GNU General Public License v3' licences.csv; then
            echo "::error::A dependency uses a licence that makes commercial SaaS unsafe."
            grep -Ei 'affero|AGPL|SSPL|GNU General Public License v3' licences.csv
            echo "This is the PyMuPDF trap. Do not merge. Talk to Vrushit."
            exit 1
          fi
          echo "All dependency licences are safe for a commercial product."

      - name: Migrations apply from an empty database
        run: |
          set -euo pipefail
          if [ -f alembic.ini ]; then
            alembic upgrade head
            echo "Migrations applied cleanly."
          else
            echo "No migrations yet, skipping."
          fi

      - name: Customer isolation tests
        run: |
          set -euo pipefail
          echo "These run first and on their own. A failure here is the worst"
          echo "thing that can happen to this product, so it must be unmissable."
          pytest -m isolation -v --no-header

      - name: Tests
        run: pytest -v --no-header --durations=10

  # ---------------------------------------------------------------------------
  # Frontend.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
