name: Pull request

# Rules for the pull request itself. They're kept apart from CI so that editing the title
# or the description re-runs them in seconds, without re-running CI. "Pull request" is a
# required check in the main ruleset.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules:
    name: Pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
      TITLE: ${{ github.event.pull_request.title }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BODY: ${{ github.event.pull_request.body }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Title
        run: |
          set -euo pipefail
          # The title becomes the commit message on main when the pull request is squash-merged.
          if grep -Eq '^(feat|feature|fix|chore|docs|test|infra)\((s[1-4]|repo)\): .+' <<< "$TITLE"; then
            echo "Title format is good."
          else
            echo "::error::Titles look like 'feat(s1): upload endpoint with deduplication'. Got: $TITLE"
            exit 1
          fi

      - name: Branch name
        run: |
          set -euo pipefail
          if [[ "$BRANCH" =~ ^dependabot/ ]] \
            || [[ "$BRANCH" =~ ^(feat|feature|fix|chore|docs|test|infra)/(s[1-4]|repo)-[a-z0-9-]+$ ]]; then
            echo "Branch name is good."
          else
            echo "::warning::Branch names look like 'feat/s1-upload-endpoint'. Got: $BRANCH"
          fi

      - name: Linked issue
        run: |
          set -euo pipefail
          if [ "$AUTHOR" = "dependabot[bot]" ] || grep -Eqi '(closes|fixes|resolves) #[0-9]+' <<< "$BODY"; then
            echo "Linked issue found, or none needed."
          else
            echo "::warning::Add 'Closes #<issue>' to the description, so the issue closes when this merges."
          fi

      - name: Size
        run: |
          set -euo pipefail
          # Lock files are machine-written, so they don't count.
          changed=$(git diff --numstat "$BASE...$HEAD" -- . ':!*.lock' ':!package-lock.json' | awk '{ a += $1; d += $2 } END { print a + d + 0 }')
          echo "Changed lines, excluding lock files: $changed"
          if [ "$changed" -gt 1000 ]; then
            echo "::error::$changed changed lines. The limit is 1000: split this pull request."
            exit 1
          fi

      - name: Tests come with the code
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE...$HEAD")
          if grep -Eq '^(backend/kaagaz|backend/scripts|frontend/(app|components|lib))/' <<< "$changed" \
            && ! grep -Eq '^(backend|frontend)/tests/' <<< "$changed"; then
            echo "::warning::Code changed but no test did. New behaviour needs a test that fails without it."
          else
            echo "Tests are accounted for."
          fi

      - name: Suppressed checks
        run: |
          set -euo pipefail
          # Each needs a reason in the pull request. Suppressing a check to get it green is never fine.
          added=$(git diff --unified=0 "$BASE...$HEAD" -- '*.py' '*.toml' | grep -E '^\+[^+]' || true)
          hits=$(grep -E '#\s*(noqa|type:\s*ignore|pragma:\s*no\s*cover)|pytest\.(mark\.)?(skip|skipif|xfail)\b|^\+\s*(extend-)?(ignore|per-file-ignores|ignore_errors|disable_error_code|ignore_missing_imports)\s*=' <<< "$added" || true)
          if [ -n "$hits" ]; then
            echo "::warning::This pull request suppresses checks. Explain each one in the description:"
            echo "$hits"
          else
            echo "No suppressed checks."
          fi

      - name: Dependencies
        run: |
          set -euo pipefail
          files=$(git diff --name-only "$BASE...$HEAD" -- backend/pyproject.toml frontend/package.json)
          if [ -z "$files" ]; then
            echo "No dependency changes."
            exit 0
          fi
          echo "::warning::Dependencies changed in: $(tr '\n' ' ' <<< "$files"). Vrushit approves every new library and its licence."

      - name: PAN- or Aadhaar-shaped values
        run: |
          set -euo pipefail
          added=$(git diff --unified=0 "$BASE...$HEAD" -- . ':!*.lock' ':!package-lock.json' | grep -E '^\+[^+]' || true)
          # Warnings only: samples may need clearly fake examples, and Vrushit decides.
          # Aadhaar: 12 digits starting 2 to 9. PAN: 5 letters (the 4th names the holder type), 4 digits, 1 letter.
          if grep -Eq '(^|[^0-9])[2-9][0-9]{3}[ -]?[0-9]{4}[ -]?[0-9]{4}([^0-9]|$)' <<< "$added"; then
            echo "::warning::Something shaped like an Aadhaar number was added. Confirm it's fake."
          fi
          if grep -Eq '(^|[^A-Za-z0-9])[A-Z]{3}[ABCFGHJLPT][A-Z][0-9]{4}[A-Z]([^A-Za-z0-9]|$)' <<< "$added"; then
            echo "::warning::Something shaped like a PAN was added. Confirm it's fake."
          fi
          echo "Identity-number scan done."
