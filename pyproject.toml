[project]
name = "kaagaz-ocr"
version = "0.1.0"
description = "Turns English business documents into SQL tables and searchable text."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["kaagaz-api", "kaagaz-shared", "kaagaz-worker"]

[tool.uv]
# The root only ties the workspace together; it is not a package itself.
package = false

[tool.uv.workspace]
members = ["api", "shared", "worker"]

[tool.uv.sources]
kaagaz-api = { workspace = true }
kaagaz-shared = { workspace = true }
kaagaz-worker = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# Beyond style, these catch what CLAUDE.md forbids: blanket excepts (BLE), leftover
# print and breakpoint calls (T20, T10), commented-out code (ERA), blanket noqa and
# type: ignore (PGH), naive datetimes (DTZ), blocking calls in async code (ASYNC),
# FastAPI mistakes (FAST) and common security bugs such as SQL built from strings (S).
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "RUF",
    "S", "BLE", "T10", "T20", "ERA", "PGH", "DTZ", "ASYNC", "FAST",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and run the hooks as subprocesses.
"tests/**" = ["S101", "S603"]
# The hooks and CI scripts report by printing.
".claude/hooks/*" = ["T201"]
".github/scripts/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["kaagaz_shared", "kaagaz_api", "kaagaz_worker"]

[tool.mypy]
python_version = "3.12"
strict = true
# Lets mypy see that pydantic-settings fills Settings fields from the environment.
plugins = ["pydantic.mypy"]
mypy_path = ["api", "shared", "worker"]
files = ["api/kaagaz_api", "shared/kaagaz_shared", "worker/kaagaz_worker", "migrations", "tests", ".claude/hooks", ".github/scripts"]

# boto3 ships no type information, so mypy can't read it. This only says so; our own code
# is still checked in full. Drop it if typed stubs for boto3 are approved.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--strict-config", "-ra"]
# Tests marked db need PostgreSQL with the migrations applied. Without Docker, run
# `uv run pytest -m "not db"`. CI runs them all.
markers = ["db: needs PostgreSQL"]
# A warning is a failure, so deprecations get fixed while they're cheap.
filterwarnings = ["error"]
xfail_strict = true
